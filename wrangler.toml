# Cloudflare Workers deploy config for Solarly.
#
# This project is a static Vite build with no server-side code, so it's
# deployed as a Worker serving static assets only — no `main` entrypoint
# script and no Workers runtime bindings are needed.
#
# Deployment is handled by Cloudflare's own Git-integrated "Workers Builds"
# (connected via the dashboard), which runs the configured build command
# and then `wrangler deploy` using this file on every push — no GitHub
# Actions secrets or workflow required.

name = "solarly"
compatibility_date = "2026-09-12"

[assets]
directory = "dist"
