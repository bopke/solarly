name: Deploy to Cloudflare Pages

# Deploys the static build to Cloudflare Pages on every push to main.
#
# Requires two repository secrets that are NOT configured by this scaffold
# (no Cloudflare credentials are available in this environment):
#   - CLOUDFLARE_API_TOKEN — a Pages-scoped API token
#   - CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
#
# If either secret is missing, this workflow skips the deploy step (with a
# warning) instead of failing, so CI stays green while the deploy is not
# yet configured. The rest of the pipeline (install/build) still validates
# the static bundle. See docs/decisions/0001-project-scaffolding.md.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare secrets are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "CF_SECRETS_SET=true" >> "$GITHUB_ENV"
          else
            echo "CF_SECRETS_SET=false" >> "$GITHUB_ENV"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping deploy step."
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_SECRETS_SET == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=solarly
