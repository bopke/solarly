name: Deploy to Cloudflare Pages

# Deploys the static build to Cloudflare Pages on every push to main.
#
# Requires two repository secrets that are NOT configured by this scaffold
# (no Cloudflare credentials are available in this environment):
#   - CLOUDFLARE_API_TOKEN — a Pages-scoped API token
#   - CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
#
# Until those secrets are added, this workflow will fail at the deploy
# step. The rest of the pipeline (install/build) still validates the
# static bundle. See docs/decisions/0001-project-scaffolding.md.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare secrets are configured
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CF_API_TOKEN_SET=true" >> "$GITHUB_ENV"
          else
            echo "CF_API_TOKEN_SET=false" >> "$GITHUB_ENV"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping deploy step."
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN_SET == 'true' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: solarly
          directory: dist
